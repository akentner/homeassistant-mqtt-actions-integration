# Names, descriptions and field texts live in the translations; a service without fields still needs its entry.
resync:

export_devices:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mqtt_actions
          multiple: true
    file_name:
      required: false
      example: backup.json
      selector:
        text:

import_devices:
  fields:
    data:
      required: false
      selector:
        object:
    file_name:
      required: false
      example: backup.json
      selector:
        text:

retrigger:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: mqtt_actions
    state:
      required: false
      example: "ON"
      selector:
        text:
