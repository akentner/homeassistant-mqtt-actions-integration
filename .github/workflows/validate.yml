name: Validate

on:
  push:
    # A version tag runs these checks once, through release.yml
    tags-ignore:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
